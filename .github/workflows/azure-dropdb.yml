name: azure-dropdb
# Stops the apps and deletes the Postgres server and all its data, without a dump.
on:
  workflow_dispatch:
    inputs:
      confirm: { description: 'Type the Postgres server name to confirm', required: true }
permissions:
  id-token: write
  contents: read
jobs:
  run:
    uses: ./.github/workflows/azure-provision.yml
    with:
      phases: dropdb
      confirm: ${{ inputs.confirm }}
    secrets: inherit
