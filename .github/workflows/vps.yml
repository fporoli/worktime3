name: vps
# The only way anything reaches the VPS. Ships the repo's deploy files from this checkout over
# SSH and runs infra/vps/remote.sh there, so the server holds no git checkout and no
# hand-maintained config. One GitHub Environment = one instance: pick it in `environment`
# (`vps` is production, e.g. `preproduction` is another one). Each environment holds its own
# secrets and variables (Settings > Environments, list in the README's Deploy section), so
# an environment with a different VPS_HOST deploys to another server, and one with the same
# VPS_HOST adds an instance next to the others, with its own subdomains.
#   deploy      edge stack + worktime3 (migrate, api, web, Keycloak) at the given image tag
#   reset-seed  DESTRUCTIVE: backs up, drops and re-creates the public schema, loads demo data
#   portainer   (re)deploys Portainer, one per server (portainer-remove takes it down)
#   destroy     DESTRUCTIVE: removes this instance (containers, database, files, Caddy site)
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to run'
        required: true
        type: choice
        options: [deploy, reset-seed, destroy, portainer, portainer-remove]
      environment: { description: 'GitHub Environment = instance (prod, preprod, test, ...)', default: 'prod' }
      image_tag: { description: 'Image tag (prefer a sha-xxxxxxx tag over latest)', default: 'latest' }
      confirmation: { description: 'reset-seed: type RESET worktime3 public schema. destroy: type DESTROY <environment name>' }
permissions:
  contents: read
concurrency:
  group: worktime3-vps
  cancel-in-progress: false
jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - name: Only main may deploy
        if: github.ref != 'refs/heads/main'
        run: echo "Run this workflow from main." && exit 1
      - name: Require explicit destructive-operation confirmation
        if: inputs.action == 'reset-seed' && inputs.confirmation != 'RESET worktime3 public schema'
        run: echo "Reset not run. Provide the exact confirmation phrase to proceed." && exit 1
      - name: Require explicit destroy confirmation
        if: inputs.action == 'destroy' && inputs.confirmation != format('DESTROY {0}', inputs.environment)
        run: echo "Destroy not run. Type DESTROY followed by the environment name." && exit 1
      - uses: actions/checkout@v7
      - name: Package deploy files
        run: tar czf release.tgz compose/docker-compose.vps.yml infra/liquibase infra/keycloak infra/postgres/seeds/seed.sql infra/caddy/edge infra/portainer infra/vps
      - name: Upload to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: release.tgz
          target: /tmp/worktime3-release
      - name: Run on VPS
        uses: appleboy/ssh-action@v1
        env:
          ACTION: ${{ inputs.action }}
          ENVIRONMENT: ${{ inputs.environment }}
          DOMAIN: ${{ vars.DOMAIN }}
          MAIL_SUB: ${{ vars.MAIL_SUB }}
          WEB_SUB: ${{ vars.WEB_SUB }}
          API_SUB: ${{ vars.API_SUB }}
          AUTH_SUB: ${{ vars.AUTH_SUB }}
          SHOW_DEMO_ACCOUNTS: ${{ vars.SHOW_DEMO_ACCOUNTS }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
          REPO: ${{ github.repository }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          KEYCLOAK_ADMIN: ${{ vars.KEYCLOAK_ADMIN }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          API_JWT_SECRET: ${{ secrets.API_JWT_SECRET }}
          PG_PORT: ${{ vars.PG_PORT }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ACTION,ENVIRONMENT,DOMAIN,MAIL_SUB,WEB_SUB,API_SUB,AUTH_SUB,SHOW_DEMO_ACCOUNTS,GHCR_USERNAME,GHCR_TOKEN,IMAGE_TAG,REPO,POSTGRES_PASSWORD,KEYCLOAK_ADMIN,KEYCLOAK_ADMIN_PASSWORD,API_JWT_SECRET,PG_PORT,SMTP_HOST,SMTP_PORT,SMTP_FROM,SMTP_USER,SMTP_PASSWORD,SMTP_SECURE
          script: |
            set -eu
            rm -rf /tmp/worktime3-release/src
            mkdir -p /tmp/worktime3-release/src
            tar xzf /tmp/worktime3-release/release.tgz -C /tmp/worktime3-release/src
            bash /tmp/worktime3-release/src/infra/vps/remote.sh "$ACTION"
            rm -rf /tmp/worktime3-release
      - name: Verify seeded demo login
        if: inputs.action == 'reset-seed'
        run: |
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 4 \
            -X POST https://${{ vars.API_SUB }}.${{ vars.DOMAIN }}/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            --data '{"email":"admin@acme.com","password":"dev1234"}' \
            | jq -e '.ok == true and .email == "admin@acme.com"' >/dev/null
          echo "Seeded demo login verified."
