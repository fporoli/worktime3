name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres:16
        env:
          POSTGRES_DB: worktime
          POSTGRES_USER: worktime
          POSTGRES_PASSWORD: worktime_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U worktime"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://worktime:worktime_ci_only@localhost:5432/worktime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --workspaces || npm install
      - run: npm run build --workspaces
      - run: npm run test --workspaces
      # Fails the build if a changelog doesn't apply cleanly to a fresh database.
      - run: npm run db:migrate
      - run: npm run db:seed
  pages:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    permissions: { pages: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p docs && cp docs/index.html docs/ 2>/dev/null || echo ok
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - uses: actions/deploy-pages@v4
