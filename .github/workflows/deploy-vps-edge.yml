name: deploy-vps-edge
# Syncs infra/caddy/edge (shared Caddy, Postgres, Mailpit, Adminer, Portainer and their
# site files) to /opt/edge on the VPS and applies it. Run after changing anything there.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: vps
    concurrency:
      group: worktime3-vps-edge
      cancel-in-progress: false
    steps:
      - name: Sync and apply edge stack
        uses: appleboy/ssh-action@v1
        env:
          EDGE_PG_ADMIN_PASSWORD: ${{ secrets.EDGE_PG_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: EDGE_PG_ADMIN_PASSWORD
          script: |
            cd /opt/worktime3 && git pull --ff-only origin main
            mkdir -p /opt/edge/sites
            cp infra/caddy/edge/docker-compose.yml infra/caddy/edge/Caddyfile /opt/edge/
            cp infra/caddy/edge/sites/*.caddy /opt/edge/sites/
            umask 077
            printf "EDGE_PG_ADMIN_PASSWORD='%s'\n" "$EDGE_PG_ADMIN_PASSWORD" > /opt/edge/.env
            cd /opt/edge
            docker compose up -d --remove-orphans
            docker exec edge-caddy caddy validate --config /etc/caddy/Caddyfile
            docker exec edge-caddy caddy reload --config /etc/caddy/Caddyfile
