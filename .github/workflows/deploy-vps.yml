name: deploy-vps
on:
  workflow_dispatch:
    inputs:
      image_tag: { description: 'Image tag', required: true, default: 'latest' }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/worktime3 && git pull
            API_IMAGE=ghcr.io/${{ github.repository }}/api:${{ inputs.image_tag }} WEB_IMAGE=ghcr.io/${{ github.repository }}/web:${{ inputs.image_tag }} docker compose -f compose/docker-compose.vps.yml up -d --build
