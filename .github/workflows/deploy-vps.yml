name: deploy-vps
on:
  workflow_dispatch:
    inputs:
      image_tag: { description: 'Image tag', required: true, default: 'latest' }
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets and variables come from the `vps` GitHub Environment (Settings > Environments).
    environment: vps
    concurrency:
      group: worktime3-vps-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          KEYCLOAK_ADMIN: ${{ vars.KEYCLOAK_ADMIN }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          API_JWT_SECRET: ${{ secrets.API_JWT_SECRET }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: POSTGRES_PASSWORD,KEYCLOAK_ADMIN,KEYCLOAK_ADMIN_PASSWORD,API_JWT_SECRET,SMTP_HOST,SMTP_PORT,SMTP_FROM,SMTP_USER,SMTP_PASSWORD,SMTP_SECURE
          script: |
            cd /opt/worktime3 && git pull
            # compose/.env is generated from the GitHub Environment on every deploy, so the
            # server holds no hand-maintained config. Values are single-quoted so compose
            # does not interpolate `$`; they must not contain a single quote.
            umask 077
            {
              for name in POSTGRES_PASSWORD KEYCLOAK_ADMIN KEYCLOAK_ADMIN_PASSWORD API_JWT_SECRET SMTP_HOST SMTP_PORT SMTP_FROM SMTP_USER SMTP_PASSWORD SMTP_SECURE; do
                printf "%s='%s'\n" "$name" "$(printenv "$name")"
              done
            } > compose/.env
            export API_IMAGE=ghcr.io/${{ github.repository }}/api:${{ inputs.image_tag }} WEB_IMAGE=ghcr.io/${{ github.repository }}/web:${{ inputs.image_tag }}
            # api/web are pre-built images (no `build:` context), so `--build` below only
            # rebuilds migrate's local Dockerfile — it never re-pulls api/web from GHCR. Without
            # this explicit pull, `up` just reuses whatever image is already cached locally under
            # the same tag, silently running stale code even after a fresh build-push.
            docker compose -f compose/docker-compose.vps.yml pull api web
            docker compose -f compose/docker-compose.vps.yml up -d --build --remove-orphans
            cp infra/caddy/edge/sites/worktime3.caddy /opt/edge/sites/worktime3.caddy
            docker exec edge-caddy caddy reload --config /etc/caddy/Caddyfile
