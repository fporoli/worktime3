# One Compose project per instance, named like its containers: worktime3-prod,
# worktime3-preprod, worktime3-test, ... The prefix comes
# from the GitHub Environment name via infra/vps/remote.sh (CONTAINER_PREFIX in compose/.env,
# which also gets passed as `-p`). Without a distinct name per instance, Compose would derive
# one from this directory ("compose") and instances would clobber each other's containers.
name: ${CONTAINER_PREFIX:?required}
services:
  # This instance's own Postgres (role and database `worktime`; Keycloak shares it in the
  # `auth` schema). Others reach it by its container name, never by `pg`: keycloak and api are
  # also on the shared `edge` network, where another `pg` (the legacy edge-pg) may exist.
  # Published on PG_PORT so a desktop client can connect: every instance on
  # a server needs its own port (e.g. 5433 production, 5434 preprod, 5435 test). It is on the
  # instance's private network only, so several instances can each have a service named `pg`.
  pg:
    image: postgres:16
    container_name: ${CONTAINER_PREFIX:?required}-pg
    ports: ["${PG_PORT:?required}:5432"]
    environment:
      POSTGRES_DB: worktime
      POSTGRES_USER: worktime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worktime -d worktime"]
      interval: 2s
      timeout: 3s
      retries: 30
  # One-shot: applies infra/liquibase/changelog via Liquibase, then exits.
  migrate:
    build: { context: ../infra/liquibase, dockerfile: Dockerfile }
    volumes:
      - ../infra/liquibase/changelog:/liquibase/changelog:ro
    command:
      - --changelog-file=db.changelog-master.xml
      - --url=jdbc:postgresql://${CONTAINER_PREFIX:?required}-pg:5432/worktime
      - --username=worktime
      - --password=${POSTGRES_PASSWORD:?required}
      - update
    depends_on:
      pg: { condition: service_healthy }
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    # No host port here — the shared edge Caddy (see infra/caddy/edge/) is the single
    # entrypoint, proxying AUTH_HOST to this container over the edge network.
    container_name: ${CONTAINER_PREFIX:?required}-keycloak
    networks: [default, edge]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${CONTAINER_PREFIX:?required}-pg:5432/worktime?currentSchema=auth
      KC_DB_USERNAME: worktime
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?required}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      # Standard "behind a TLS-terminating reverse proxy" recipe: without KC_HOSTNAME,
      # Keycloak's issuer/redirect URLs come out wrong; KC_HTTP_ENABLED lets Caddy reach
      # it over plain HTTP internally since Caddy itself is the one terminating TLS.
      KC_HOSTNAME: ${AUTH_HOST:?required}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      # Rendered per instance by infra/vps/remote.sh (redirect URIs follow WEB_HOST).
      - ${REALM_FILE:?required}:/opt/keycloak/data/import/realm-worktime.json:ro
    command: ["start", "--import-realm"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  api:
    image: ${API_IMAGE:?required}
    # No host port here — the shared edge Caddy (see infra/caddy/edge/) is the single
    # entrypoint, proxying API_HOST to this container over the edge network.
    container_name: ${CONTAINER_PREFIX:?required}-api
    networks: [default, edge]
    environment:
      DATABASE_URL: postgresql://worktime:${POSTGRES_PASSWORD:?required}@${CONTAINER_PREFIX:?required}-pg:5432/worktime
      NODE_ENV: production
      # main.ts defaults to 8001 when unset; the Dockerfile's EXPOSE and the edge
      # Caddy's reverse_proxy both assume 8000, so this must be set explicitly.
      API_PORT: "8000"
      JWT_ISSUER: https://${AUTH_HOST:?required}/realms/worktime
      JWT_AUDIENCE: worktime-web
      # NODE_ENV=production makes jwt.ts refuse to boot without this instead of silently
      # falling back to the insecure hardcoded dev secret — set a real random value.
      API_JWT_SECRET: ${API_JWT_SECRET:?required}
      APP_BASE_URL: https://${WEB_HOST:?required}
      # Defaults to the shared Mailpit catcher on the edge network (see
      # infra/caddy/edge/) — override via compose/.env to point at a real relay instead.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-worktime@localhost}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    depends_on:
      migrate: { condition: service_completed_successfully }
  web:
    image: ${WEB_IMAGE:?required}
    # No host port here — the shared edge Caddy (see infra/caddy/edge/) is the single
    # entrypoint, proxying WEB_HOST to this container over the edge network.
    container_name: ${CONTAINER_PREFIX:?required}-web
    networks: [edge]
    # One image for every instance: these replace the build-time placeholders at start.
    environment:
      WT_API_URL: https://${API_HOST:?required}/api/v1
      WT_KEYCLOAK_URL: https://${AUTH_HOST:?required}
      WT_SHOW_DEMO_ACCOUNTS: ${SHOW_DEMO_ACCOUNTS:-false}
networks:
  # Private to this instance: pg, migrate, keycloak and api talk over it.
  default: {}
  # Pre-existing network owned by the shared edge stack (infra/caddy/edge/): the one Caddy
  # that fronts every instance on this server (and other projects, e.g. worktime2) reaches
  # keycloak, api and web by container name over it. Created once via
  # `docker network create edge` (remote.sh does it), not by this project.
  edge:
    external: true
volumes:
  pg_data:
