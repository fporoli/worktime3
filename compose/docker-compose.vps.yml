# Explicit project name: without it, Compose derives the project name from this
# directory's basename ("compose"), which collides with any other project that
# also keeps its compose file in a directory called "compose" (e.g. worktime2) —
# both would get containers named compose-api-1, compose-web-1, etc. on the same
# Docker host, and `docker compose up` for one would clobber the other's containers.
name: worktime3
services:
  pg:
    image: postgres:16
    # No host port — reachable only from other containers on this network. Direct
    # internet exposure isn't needed; everything talks to Postgres over the compose
    # network, and the whole point of this environment is HTTPS-only via Caddy.
    environment:
      POSTGRES_DB: worktime
      POSTGRES_USER: worktime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worktime"]
      interval: 2s
      timeout: 3s
      retries: 30
  # One-shot: applies infra/liquibase/changelog via Liquibase, then exits.
  migrate:
    build: { context: ../infra/liquibase, dockerfile: Dockerfile }
    volumes:
      - ../infra/liquibase/changelog:/liquibase/changelog:ro
    command:
      - --changelog-file=db.changelog-master.xml
      - --url=jdbc:postgresql://pg:5432/worktime
      - --username=worktime
      - --password=${POSTGRES_PASSWORD:?required}
      - update
    depends_on:
      pg: { condition: service_healthy }
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    # No host port here — the shared edge Caddy (see infra/caddy/edge/) is the single
    # entrypoint, proxying wtauth.turbotapir.com to this container over the edge network.
    container_name: worktime3-keycloak
    networks: [default, edge]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://pg:5432/worktime?currentSchema=auth
      KC_DB_USERNAME: worktime
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?required}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      # Standard "behind a TLS-terminating reverse proxy" recipe: without KC_HOSTNAME,
      # Keycloak's issuer/redirect URLs come out wrong; KC_HTTP_ENABLED lets Caddy reach
      # it over plain HTTP internally since Caddy itself is the one terminating TLS.
      KC_HOSTNAME: wtauth.turbotapir.com
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    command: ["start", "--import-realm"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  api:
    image: ${API_IMAGE:?required}
    # No host port here — the shared edge Caddy (see infra/caddy/edge/) is the single
    # entrypoint, proxying wtservice.turbotapir.com to this container over the edge network.
    container_name: worktime3-api
    networks: [default, edge]
    environment:
      DATABASE_URL: postgresql://worktime:${POSTGRES_PASSWORD:?required}@pg:5432/worktime
      NODE_ENV: production
      # main.ts defaults to 8001 when unset; the Dockerfile's EXPOSE and the edge
      # Caddy's reverse_proxy both assume 8000, so this must be set explicitly.
      API_PORT: "8000"
      JWT_ISSUER: https://wtauth.turbotapir.com/realms/worktime
      JWT_AUDIENCE: worktime-web
      # NODE_ENV=production makes jwt.ts refuse to boot without this instead of silently
      # falling back to the insecure hardcoded dev secret — set a real random value.
      API_JWT_SECRET: ${API_JWT_SECRET:?required}
      APP_BASE_URL: https://wt.turbotapir.com
      # Real relay, optional: unset SMTP_HOST leaves mail sends failing silently
      # (fire-and-forget, never breaks a request) until these are provided.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-worktime@localhost}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    depends_on:
      migrate: { condition: service_completed_successfully }
  web:
    image: ${WEB_IMAGE:?required}
    # No host port here — the shared edge Caddy (see infra/caddy/edge/) is the single
    # entrypoint, proxying wt.turbotapir.com to this container over the edge network.
    container_name: worktime3-web
    networks: [default, edge]
networks:
  default:
  # Pre-existing network owned by the shared edge Caddy stack (infra/caddy/edge/),
  # which also fronts other projects (e.g. worktime2) on this VPS. Created once via
  # `docker network create edge` as part of setting up that stack — not by this project.
  edge:
    external: true
volumes:
  pgdata:
