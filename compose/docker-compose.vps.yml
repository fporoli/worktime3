# Explicit project name: without it, Compose derives the project name from this
# directory's basename ("compose"), which collides with any other project that
# also keeps its compose file in a directory called "compose" (e.g. worktime2) —
# both would get containers named compose-api-1, compose-web-1, etc. on the same
# Docker host, and `docker compose up` for one would clobber the other's containers.
name: worktime3
services:
  # One-shot: applies infra/liquibase/changelog via Liquibase, then exits. Talks to the
  # shared Postgres server in the edge stack (infra/caddy/edge/), not a local container —
  # worktime3 keeps its own role/database (role and database both named DB_NAME) on that shared server.
  migrate:
    build: { context: ../infra/liquibase, dockerfile: Dockerfile }
    volumes:
      - ../infra/liquibase/changelog:/liquibase/changelog:ro
    command:
      - --changelog-file=db.changelog-master.xml
      - --url=jdbc:postgresql://edge-pg:5432/${DB_NAME:?required}
      - --username=${DB_NAME:?required}
      - --password=${POSTGRES_PASSWORD:?required}
      - update
    networks: [edge]
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    # No host port here — the shared edge Caddy (see infra/caddy/edge/) is the single
    # entrypoint, proxying AUTH_HOST to this container over the edge network.
    container_name: ${CONTAINER_PREFIX:?required}-keycloak
    networks: [edge]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://edge-pg:5432/${DB_NAME:?required}?currentSchema=auth
      KC_DB_USERNAME: ${DB_NAME:?required}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?required}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      # Standard "behind a TLS-terminating reverse proxy" recipe: without KC_HOSTNAME,
      # Keycloak's issuer/redirect URLs come out wrong; KC_HTTP_ENABLED lets Caddy reach
      # it over plain HTTP internally since Caddy itself is the one terminating TLS.
      KC_HOSTNAME: ${AUTH_HOST:?required}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      # Rendered per instance by infra/vps/remote.sh (redirect URIs follow WEB_HOST).
      - ${REALM_FILE:?required}:/opt/keycloak/data/import/realm-worktime.json:ro
    command: ["start", "--import-realm"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  api:
    image: ${API_IMAGE:?required}
    # No host port here — the shared edge Caddy (see infra/caddy/edge/) is the single
    # entrypoint, proxying API_HOST to this container over the edge network.
    container_name: ${CONTAINER_PREFIX:?required}-api
    networks: [edge]
    environment:
      DATABASE_URL: postgresql://${DB_NAME:?required}:${POSTGRES_PASSWORD:?required}@edge-pg:5432/${DB_NAME:?required}
      NODE_ENV: production
      # main.ts defaults to 8001 when unset; the Dockerfile's EXPOSE and the edge
      # Caddy's reverse_proxy both assume 8000, so this must be set explicitly.
      API_PORT: "8000"
      JWT_ISSUER: https://${AUTH_HOST:?required}/realms/worktime
      JWT_AUDIENCE: worktime-web
      # NODE_ENV=production makes jwt.ts refuse to boot without this instead of silently
      # falling back to the insecure hardcoded dev secret — set a real random value.
      API_JWT_SECRET: ${API_JWT_SECRET:?required}
      APP_BASE_URL: https://${WEB_HOST:?required}
      # Defaults to the shared Mailpit catcher on the edge network (see
      # infra/caddy/edge/) — override via compose/.env to point at a real relay instead.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-worktime@localhost}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    depends_on:
      migrate: { condition: service_completed_successfully }
  web:
    image: ${WEB_IMAGE:?required}
    # No host port here — the shared edge Caddy (see infra/caddy/edge/) is the single
    # entrypoint, proxying WEB_HOST to this container over the edge network.
    container_name: ${CONTAINER_PREFIX:?required}-web
    networks: [edge]
    # One image for every instance: these replace the build-time placeholders at start.
    environment:
      WT_API_URL: https://${API_HOST:?required}/api/v1
      WT_KEYCLOAK_URL: https://${AUTH_HOST:?required}
      WT_SHOW_DEMO_ACCOUNTS: ${SHOW_DEMO_ACCOUNTS:-false}
networks:
  # Pre-existing network owned by the shared edge stack (infra/caddy/edge/), which also
  # runs the shared Postgres server and fronts other projects (e.g. worktime2) on this
  # VPS. Created once via `docker network create edge` as part of setting up that stack
  # — not by this project. Every service here now lives on it — nothing is local-only
  # anymore, since even Postgres moved to the shared stack — so there's no separate
  # project-private network to declare.
  edge:
    external: true
