services:
  pg:
    image: postgres:16
    ports: ["5431:5432"]
    environment:
      POSTGRES_DB: worktime
      POSTGRES_USER: worktime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worktime_dev_only}
    volumes:
      - ../data-local/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worktime"]
      interval: 2s
      timeout: 3s
      retries: 30
  # One-shot: applies infra/liquibase/changelog via Liquibase, then exits.
  # Schema is no longer seeded through docker-entrypoint-initdb.d — that only
  # ever ran once, on an empty volume, which is exactly how this local
  # database went stale relative to schema.sql in the past. Liquibase tracks
  # applied changesets in the database itself, so `migrate` is safe to rerun
  # on every `docker compose up`.
  migrate:
    build: { context: ../infra/liquibase, dockerfile: Dockerfile }
    volumes:
      - ../infra/liquibase/changelog:/liquibase/changelog:ro
    command:
      - --changelog-file=db.changelog-master.xml
      - --url=jdbc:postgresql://pg:5432/worktime
      - --username=worktime
      - --password=${POSTGRES_PASSWORD:-worktime_dev_only}
      - update
    depends_on:
      pg: { condition: service_healthy }
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      # Newer Mailpit refuses AUTH over a plaintext connection unless told this is
      # intentional. Fine here — this catcher never leaves localhost, no real mail.
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    ports: ["8091:8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://pg:5432/worktime?currentSchema=auth
      KC_DB_USERNAME: worktime
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-worktime_dev_only}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_only}
    volumes:
      - ../data-local/kc:/opt/keycloak/data
      - ../infra/keycloak/realm-worktime.json:/opt/keycloak/data/import/realm-worktime.json:ro
    command: ["start-dev", "--import-realm"]
    depends_on:
      # Needs the `auth` schema, which migrate's first changeset creates.
      migrate: { condition: service_completed_successfully }
