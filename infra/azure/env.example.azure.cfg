# --- Azure Container Apps config for infra/azure/provision.sh ---
# Copy to infra/azure/.env.azure (gitignored) and fill in. Never commit real values.

# Target tenant/subscription (az account show --query "{tenant:tenantId, sub:id}").
AZURE_TENANT_ID=
AZURE_SUBSCRIPTION_ID=
LOCATION=switzerlandnorth
RESOURCE_GROUP=rg-worktime3

# Postgres Flexible Server name: globally unique, 3-63 lowercase letters/digits/hyphens.
PG_SERVER_NAME=
# Storage account for the API's uploaded documents: globally unique, 3-24 lowercase letters/digits.
DOCS_STORAGE_ACCOUNT=

# GHCR images built by .github/workflows/build-push.yml. GHCR_TOKEN: a classic GitHub PAT
# with read:packages only, used by Azure to pull the private images.
GITHUB_REPOSITORY=fporoli/worktime3
GHCR_USERNAME=
GHCR_TOKEN=
IMAGE_TAG=latest

# Generate once and keep: changing them later locks the apps out of an existing database.
# POSTGRES_PASSWORD is embedded unencoded in DATABASE_URL, so letters and digits only, and
# Flexible Server wants upper case, lower case and digits (hex alone is rejected):
#   openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 40
POSTGRES_PASSWORD=
KEYCLOAK_ADMIN=admin
# openssl rand -base64 32
KEYCLOAK_ADMIN_PASSWORD=
API_JWT_SECRET=
# Bcrypt hash for Adminer's browser prompt (user admin), in single quotes. This one is dev1234,
# same as the VPS. Sign-in and POSTGRES_PASSWORD still protect it. To change it:
#   docker run --rm caddy:2 caddy hash-password --plaintext '<new password>'
ADMINER_PASSWORD_HASH='$2a$14$opJQuMHuwSkeIxPw6zrQN.FRI2gLhHY7zKXCK2EigQ6qf6r0LiDXK'

# Outgoing mail, optional: unset SMTP_HOST leaves mail as a silent no-op.
SMTP_HOST=
SMTP_PORT=587
SMTP_FROM=worktime@localhost
SMTP_USER=
SMTP_PASSWORD=
SMTP_SECURE=false
